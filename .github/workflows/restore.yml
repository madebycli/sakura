name: One-time repository restore

on:
  pull_request:

permissions:
  contents: write

jobs:
  restore:
    if: github.repository == 'madebycli/sakura'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create clean source-only main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_CHUNKS: >-
            5a94cd0242e39562ef9a862fbbf8d3a9251eb707
            6f27da6dca34d3807287e5c7984ddc22a78bbaeb
            ced14624f9bec7ebdac993316a3d489be1271edc
            39fa9395976c1ffdbeecf9920ce1b655f8d8a3fe
            3b03e3720ea78f0664489cf5cf04166cab5c1a8b
            74b9e05107f8b01000bfa25901cc727662d06fbf
          EXPECTED_SIZE: "16977"
          EXPECTED_SHA256: "fa5b8f481e86721600ae00eccd776df974a1b83e393d1c3057196238902469a3"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          archive="$work/repository.tar.gz"
          : > "$archive"
          for sha in $PAYLOAD_CHUNKS; do
            response="$work/$sha.json"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              > "$response"
            python3 -c 'import base64,json,pathlib,sys; data=json.loads(pathlib.Path(sys.argv[1]).read_text()); open(sys.argv[2],"ab").write(base64.b64decode(data["content"]))' "$response" "$archive"
          done
          test "$(stat -c %s "$archive")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          mkdir "$work/source"
          tar --warning=no-timestamp -xzf "$archive" -C "$work/source" --strip-components=1
          cd "$work/source"
          rm -f .github/workflows/ci.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git init
          git config user.name "madebycli"
          git config user.email "madebycli@users.noreply.github.com"
          git add -A
          git commit -m "restore: rebuild repository from recovered sources"
          git branch -M main
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
